<!DOCTYPE html>
<html>
<head>
  <title>Lazy Load New Tabs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 320px;
    }

    h1 {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      color: #666;
      margin-bottom: 16px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 24px;
      margin-left: 8px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-switch .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      border-radius: 24px;
      transition: 0.4s;
    }

    .toggle-switch .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 2px;
      top: 2px;
      background-color: #fff;
      border-radius: 50%;
      transition: 0.4s;
    }

    .toggle-switch input:checked + .slider {
      background-color: #4CAF50;
    }

    .toggle-switch input:focus + .slider {
      box-shadow: 0 0 1px #4CAF50;
    }

    .toggle-switch input:checked + .slider:before {
      transform: translateX(16px);
    }

    label {
      font-size: 14px;
      color: #333;
    }

    .input-label {
      font-size: 13px;
      color: #444;
    }

    input[type="number"] {
      width: 100px;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
    }

    input[type="number"]:disabled {
      opacity: 0.6;
      background-color: #eee;
    }

    .note {
      font-size: 12px;
      color: #777;
      margin-top: 8px;
    }

    .queue-section {
      border-top: 1px solid #e5e5e5;
      margin-top: 14px;
      padding-top: 12px;
    }

    .queue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: bold;
      color: #333;
      margin-bottom: 8px;
    }

    .badge {
      background-color: #4CAF50;
      color: #fff;
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 12px;
      min-width: 18px;
      text-align: center;
    }

    .queue-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    button {
      flex: 1;
      padding: 6px 8px;
      font-size: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background-color: #fff;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .queue-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 140px;
      overflow-y: auto;
    }

    .queue-item {
      font-size: 12px;
      color: #444;
      padding: 4px 0;
      border-bottom: 1px solid #eee;
    }

    .queue-item:last-child {
      border-bottom: none;
    }

    .queue-more {
      color: #777;
    }

    .queue-empty {
      font-size: 12px;
      color: #777;
    }
  </style>
</head>
<body>
  <h1>Lazy Load New Tabs</h1>
  <p>Open links in a new tab with lazy loading!</p>

  <div class="setting-row">
    <span>Enable Lazy Load Tabs</span>
    <label class="toggle-switch">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </div>

  <div class="setting-row">
    <span>Auto Load Lazy Tabs</span>
    <label class="toggle-switch">
      <input type="checkbox" id="autoLoadEnabled">
      <span class="slider"></span>
    </label>
  </div>

  <div class="setting-row">
    <label class="input-label" for="autoLoadIntervalSeconds">Cooling Period (seconds)</label>
    <input type="number" id="autoLoadIntervalSeconds" min="1" step="1">
  </div>

  <p class="note">Auto-loads one lazy tab per interval.</p>

  <div class="queue-section">
    <div class="queue-header">
      <span>Queued Lazy Tabs</span>
      <span class="badge" id="queueCount">0</span>
    </div>
    <div class="queue-actions">
      <button id="loadNext" type="button">Load Next</button>
      <button id="refreshQueue" type="button">Refresh</button>
    </div>
    <ul class="queue-list" id="queueList"></ul>
    <div class="queue-empty" id="queueEmpty">No queued lazy tabs.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
