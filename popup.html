<!DOCTYPE html>
<html>
<head>
  <title>Lazy Load New Tabs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 300px;
    }

    h1 {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      color: #666;
      margin-bottom: 16px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 24px;
      margin-left: 8px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-switch .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      border-radius: 24px;
      transition: 0.4s;
    }

    .toggle-switch .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 2px;
      top: 2px;
      background-color: #fff;
      border-radius: 50%;
      transition: 0.4s;
    }

    .toggle-switch input:checked + .slider {
      background-color: #4CAF50;
    }

    .toggle-switch input:focus + .slider {
      box-shadow: 0 0 1px #4CAF50;
    }

    .toggle-switch input:checked + .slider:before {
      transform: translateX(16px);
    }

    label {
      font-size: 14px;
      color: #333;
    }

    .input-label {
      font-size: 13px;
      color: #444;
    }

    input[type="number"] {
      width: 90px;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
    }

    input[type="number"]:disabled {
      opacity: 0.6;
      background-color: #eee;
    }

    .note {
      font-size: 12px;
      color: #777;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>Lazy Load New Tabs</h1>
  <p>Open links in a new tab with lazy loading!</p>

  <div class="setting-row">
    <span>Enable Lazy Load Tabs</span>
    <label class="toggle-switch">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </div>

  <div class="setting-row">
    <span>Auto Load Lazy Tabs</span>
    <label class="toggle-switch">
      <input type="checkbox" id="autoLoadEnabled">
      <span class="slider"></span>
    </label>
  </div>

  <div class="setting-row">
    <label class="input-label" for="autoLoadIntervalSeconds">Cooling Period (seconds)</label>
    <input type="number" id="autoLoadIntervalSeconds" min="1" step="1">
  </div>

  <p class="note">Auto-loads one lazy tab per interval.</p>

  <script src="popup.js"></script>
</body>
</html>
